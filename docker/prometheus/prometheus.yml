global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "stocksense-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:3001"]
        labels:
          environment: "production"
          service: "stocksense-backend"
