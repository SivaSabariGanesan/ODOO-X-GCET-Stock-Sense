<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      StockSense — Inventory Management
      Built on Odoo · React 18 + Tailwind CSS + TypeScript
    -->
    <title>StockSense</title>

    <!-- Favicon (replace with actual asset) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Font preconnect — reduces latency for Google Fonts.
      The actual @import is in globals.css; preconnect here
      ensures the DNS + TLS handshake happens as early as possible.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Meta description for SEO / link previews
    -->
    <meta
      name="description"
      content="StockSense — Precision inventory management and operations"
    />

    <meta name="theme-color" content="#69529b" />
  </head>
  <body class="bg-app text-gray-800 antialiased selection:bg-brand-light selection:text-brand-dark">
    <!-- React mounts here -->
    <div id="root" style="background-color: #f8fafc; min-height: 100vh;"></div>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
