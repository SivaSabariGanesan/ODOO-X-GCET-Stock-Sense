version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stocksense_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stocksense_db}
      POSTGRES_USER: ${POSTGRES_USER:-stocksense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocksense_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stocksense_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-stocksense} -d $${POSTGRES_DB:-stocksense_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stocksense_backend_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-stocksense}:${POSTGRES_PASSWORD:-stocksense_pass}@postgres:5432/${POSTGRES_DB:-stocksense_db}
      JWT_SECRET: ${JWT_SECRET:-stocksense_prod_jwt_secret_key_2026_change_me}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:80}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"StockSense Security <noreply@stocksense.io>"}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-llama-3.3-70b-versatile}
    networks:
      - stocksense_net
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost}
    container_name: stocksense_frontend_prod
    restart: always
    networks:
      - stocksense_net

  proxy:
    image: nginx:alpine
    container_name: stocksense_proxy_prod
    restart: always
    ports:
      - "${PORT_HTTP:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - stocksense_net
    depends_on:
      - backend
      - frontend

  # ---------------------------------------------------------------------------
  # StockSense Production Monitoring & Observability Stack
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: stocksense_prometheus_prod
    restart: always
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - stocksense_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - backend

  loki:
    image: grafana/loki:2.9.4
    container_name: stocksense_loki_prod
    restart: always
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/tmp/loki
    networks:
      - stocksense_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  promtail:
    image: grafana/promtail:2.9.4
    container_name: stocksense_promtail_prod
    restart: always
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./docker/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - stocksense_net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.4.0
    container_name: stocksense_grafana_prod
    restart: always
    ports:
      - "${PORT_GRAFANA:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-stocksense_grafana_2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - stocksense_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
    name: stocksense_postgres_prod_data
  prometheus_data:
    name: stocksense_prometheus_prod_data
  loki_data:
    name: stocksense_loki_prod_data
  grafana_data:
    name: stocksense_grafana_prod_data

networks:
  stocksense_net:
    name: stocksense_prod_network
    driver: bridge
